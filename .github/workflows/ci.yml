name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crewboard
          POSTGRES_PASSWORD: crewboard
          POSTGRES_DB: crewboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crewboard -d crewboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://crewboard:crewboard@localhost:5432/crewboard_test
      TEST_DATABASE_URL: postgresql://crewboard:crewboard@localhost:5432/crewboard_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Workspaces without a build script are skipped
      - run: npm run build --workspaces --if-present
