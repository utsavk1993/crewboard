name: crewboard

services:
  postgres:
    image: postgres:17-alpine
    container_name: crewboard-db
    environment:
      POSTGRES_USER: crewboard
      POSTGRES_PASSWORD: crewboard
      POSTGRES_DB: crewboard
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once on first start: creates the separate database used by API tests.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewboard -d crewboard"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
